name: Release

# 推送 v* 標籤（例如 v1.1.0）時：建置簽名的手機與手錶 APK，發佈到 GitHub Releases。
# 手機可用 Obtainium 追蹤此 repo 的 Releases 自動更新。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for m in app wear; do
            V=$(grep -oP 'versionName = "\K[^"]+' "$m/build.gradle.kts")
            if [ "$V" != "$TAG" ]; then
              echo "::error::$m versionName ($V) does not match tag ($TAG)"; exit 1
            fi
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GYMQR_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APKs
        env:
          GYMQR_KEYSTORE: ${{ runner.temp }}/release.jks
          GYMQR_KEYSTORE_PASSWORD: ${{ secrets.GYMQR_KEYSTORE_PASSWORD }}
          GYMQR_KEY_ALIAS: ${{ secrets.GYMQR_KEY_ALIAS }}
          GYMQR_KEY_PASSWORD: ${{ secrets.GYMQR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :wear:assembleRelease

      - name: Collect APKs
        run: |
          VER="${GITHUB_REF_NAME}"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk  "dist/gymqr-phone-${VER}.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "dist/gymqr-wear-${VER}.apk"
          ls -la dist

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes

      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk
